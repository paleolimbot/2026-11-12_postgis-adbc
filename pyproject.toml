[project]
name = "postgis-ingest-benchmarks"
version = "0.1.0"
description = "Reproducible PostGIS ingestion implementations"
requires-python = ">=3.11"
dependencies = [
    "adbc-driver-postgresql==1.13.0",
    "duckdb==2.0.0",
    "geoalchemy2==0.20.0",
    "geopandas==1.2.0",
    "pyarrow==26.0.1",
    "psycopg[binary]==3.3.9",
    "sqlalchemy==2.1.9",
]

[project.scripts]
postgis-ingest = "ingest.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
